
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villaruz Registration Form</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page-container">

        <section class="registration-card">

            <!-- HEADER -->
            <header class="form-header">

                <h1>VILLARUZ REGRSTRATION FORM</h1>

                <p>Please complete the form below to register.</p>
            </div>

            </header>

            <!-- REGISTRATION FORM -->
            <form id="registrationForm" novalidate>

                <div class="section-heading">
                    <i class="fa-solid fa-user"></i>
                    <h2>Personal Information</h2>
                </div>

                <div class="form-grid">

                    <!-- FIRST NAME -->
                    <div class="form-group">
                        <label for="firstName">First Name <span>*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input type="text" id="firstName"
                                placeholder="Enter your first name"
                                required>
                        </div>
                        <small class="error-message"></small>
                    </div>

                    <!-- LAST NAME -->
                    <div class="form-group">
                        <label for="lastName">Last Name <span>*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input type="text" id="lastName"
                                placeholder="Enter your last name"
                                required>
                        </div>
                        <small class="error-message"></small>
                    </div>

                    <!-- USERNAME -->
                    <div class="form-group">
                        <label for="username">Username <span>*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-at input-icon"></i>
                            <input type="text" id="username"
                                placeholder="5-12 characters"
                                minlength="5" maxlength="12"
                                required>
                        </div>
                        <small class="error-message"></small>
                    </div>

                    <!-- EMAIL -->
                    <div class="form-group">
                        <label for="email">Email Address <span>*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-envelope input-icon"></i>
                            <input type="email" id="email"
                                placeholder="ex.(Villaruzjexter@gmail.com)"
                                required>
                        </div>
                        <small class="error-message"></small>
                    </div>

                    <!-- PASSWORD -->
                    <div class="form-group">
                        <label for="password">Password <span>*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="password"
                                placeholder="8-16 characters"
                                minlength="8" maxlength="16"
                                required>
                            <button type="button" class="toggle-password"
                                data-target="password" aria-label="Show password">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                        <small class="error-message"></small>
                    </div>

                    <!-- CONFIRM PASSWORD -->
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password <span>*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-shield-halved input-icon"></i>
                            <input type="password" id="confirmPassword"
                                placeholder="Re-enter your password"
                                required>
                            <button type="button" class="toggle-password"
                                data-target="confirmPassword"
                                aria-label="Show confirmation password">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                        <small class="error-message"></small>
                    </div>

                    <!-- MOBILE NUMBER -->
                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-phone input-icon"></i>
                            <input type="tel" id="mobile"
                                placeholder="Enter mobile number"
                                inputmode="numeric">
                        </div>
                        <small class="error-message"></small>
                    </div>

                    <!-- DATE OF BIRTH -->
                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-calendar-days input-icon"></i>
                            <input type="date" id="dob">
                        </div>
                        <small class="error-message"></small>
                    </div>

                    <!-- GENDER -->
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-venus-mars input-icon"></i>
                            <select id="gender">
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Prefer not to say">Prefer not to say</option>
                            </select>
                        </div>
                        <small class="error-message"></small>
                    </div>

                    <!-- LANGUAGE -->
                    <div class="form-group">
                        <label for="language">Language Spoken</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-language input-icon"></i>
                            <select id="language">
                                <option value="">Select Language</option>
                                <option value="Cebuano">Cebuano</option>
                                <option value="Tagalog">Tagalog</option>
                                <option value="English">English</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>
                        <small class="error-message"></small>
                    </div>

                    <!-- RELIGION -->
                    <div class="form-group">
                        <label for="religion">Religion</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-book-open input-icon"></i>
                            <select id="religion">
                                <option value="">Select Religion</option>
                                <option value="Roman Catholic">Roman Catholic</option>
                                <option value="Christian">Christian</option>
                                <option value="Islam">Islam</option>
                                <option value="Iglesia ni Cristo">Iglesia ni Cristo</option>
                                <option value="Other">Other</option>
                                <option value="Prefer not to say">Prefer not to say</option>
                            </select>
                        </div>
                        <small class="error-message"></small>
                    </div>

                </div>

                <!-- UPLOAD SECTION -->
                <div class="section-heading upload-heading">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <h2>Upload Your File</h2>
                </div>

                <div class="form-group full-width">
                    <label for="fileUpload">Resume or Display Picture</label>

                    <div class="upload-box">
                        <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>

                        <p>Choose a file or drag it here</p>

                        <span>PDF, DOC, DOCX, JPG, PNG, GIF</span>

                        <input type="file" id="fileUpload"
                            accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.gif">

                        <label for="fileUpload" class="upload-button">
                            <i class="fa-solid fa-folder-open"></i>
                            Select File
                        </label>

                        <div id="fileName" class="file-name">
                            No file selected
                        </div>
                    </div>

                    <small class="error-message"></small>
                </div>

                <!-- ADDRESS -->
                <div class="section-heading address-heading">
                    <i class="fa-solid fa-location-dot"></i>
                    <h2>Contact Information</h2>
                </div>

                <div class="form-group full-width">
                    <label for="address">Address</label>

                    <div class="input-wrapper textarea-wrapper">
                        <i class="fa-solid fa-map-marker-alt input-icon"></i>
                        <textarea id="address"
                            placeholder="Enter your complete address..."
                            rows="4"></textarea>
                    </div>

                    <small class="error-message"></small>
                </div>

                <!-- FORM MESSAGE -->
                <div id="formMessage" role="status" aria-live="polite"></div>

                <!-- BUTTONS -->
                <div class="button-container">

                    <button type="reset" class="clear-button">
                        <i class="fa-solid fa-rotate-left"></i>
                        Clear Form
                    </button>

                    <button type="submit" class="submit-button">
                        <i class="fa-solid fa-paper-plane"></i>
                        Submit Registration
                    </button>

                </div>

                <p class="footer-text">
                    <i class="fa-solid fa-shield-halved"></i>
                    Your information is handled with care.
                </p>

            </form>

        </section>

        <footer class="page-footer">
             Villaruz Registration Form
        </footer>

    </main>

    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>
</html>
